image:
  repository: ghcr.io/castai/ko
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

containerd:
  socketPaths:
    - /run/containerd/containerd.sock
    - /run/k0s/containerd.sock

# Host path of the tracefs mount. Resolving tracepoint IDs requires
# tracefs inside the container; it is always mounted at /sys/kernel/tracing.
# On hosts without a standalone tracefs mount, point this to
# /sys/kernel/debug/tracing instead.
tracefsPath: /sys/kernel/tracing

# Agent configuration rendered to config.yaml. Templated with tpl,
# so Helm expressions like {{ .Release.Name }} can be used inside.
config: |
  exporters:
    - name: stdout
  tracer:
    filters:
      ignoreLoopback: true
  metrics:
    addr: ":{{ .Values.metricsPort }}"
  kontext:
    socketPaths:{{ range .Values.containerd.socketPaths }}
      - {{ . }}{{ end }}

# Prometheus /metrics endpoint served by the agent.
metricsPort: 9081

jsonLog: false

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

priorityClassName: ""

podAnnotations: {}
podLabels: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 100%

resources: {}
#  requests:
#    cpu: 10m
#    memory: 64Mi

nodeSelector:
  kubernetes.io/os: linux

# The agent must observe every node, including control-plane hosts.
tolerations:
  - operator: Exists

affinity: {}
