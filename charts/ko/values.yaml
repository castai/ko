image:
  repository: ghcr.io/castai/ko
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Host path of the containerd socket serving the CRI API. Mounted at the
# same path into the container.
containerd:
  socketPath: /run/containerd/containerd.sock

# Host path of the tracefs mount. Resolving tracepoint IDs requires
# tracefs inside the container; it is always mounted at /sys/kernel/tracing.
# On hosts without a standalone tracefs mount, point this to
# /sys/kernel/debug/tracing instead.
tracefsPath: /sys/kernel/tracing

# Agent configuration rendered to config.yaml. Templated with tpl,
# so Helm expressions like {{ .Release.Name }} can be used inside.
config: |
  exporters:
    - name: stdout
  tracer:
    filters:
      ignoreLoopback: true
  metrics:
    addr: ":{{ .Values.metricsPort }}"
  {{- if .Values.conntest.enabled }}
  conntest:
    enabled: true
    listenPort: {{ .Values.conntest.listenPort }}
    interval: {{ .Values.conntest.interval }}
    timeout: {{ .Values.conntest.timeout }}
  {{- end }}

# Prometheus /metrics endpoint served by the agent. Components
# (conntest, and later ones) register their metrics on it when enabled.
metricsPort: 9081

# Mesh connectivity test: each pod probes every other ko pod over a
# long-lived TCP connection and reports the results as Prometheus
# metrics. Requires pods list/watch RBAC, which the chart creates
# when enabled.
conntest:
  enabled: false
  listenPort: 9080
  interval: 5s
  timeout: 2s

jsonLog: false

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

priorityClassName: ""

podAnnotations: {}
podLabels: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 100%

resources: {}
#  requests:
#    cpu: 10m
#    memory: 64Mi

nodeSelector:
  kubernetes.io/os: linux

# The agent must observe every node, including control-plane hosts.
tolerations:
  - operator: Exists

affinity: {}
